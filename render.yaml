# Render Blueprint for the API. Connect the repo, then fill the variables marked sync: false.
services:
  - type: web
    name: proyecto3-api
    runtime: node
    plan: free
    healthCheckPath: /health
    # --include=dev keeps the Prisma CLI and TypeScript, which the build and migrations need.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon connection string, with sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # e.g. https://proyecto3.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
